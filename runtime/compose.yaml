services:
  cognitia-runtime:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    container_name: cognitia-standalone-runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # Bound strictly to 127.0.0.1 (Local-First security invariant)
      # Uses host port 8001 to avoid conflicts with other local services
      - "127.0.0.1:8001:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - COGNITIA_HOST=0.0.0.0
      - COGNITIA_PORT=8000
      - ALLOW_INSECURE_BIND=1
    healthcheck:
      test: ["CMD", "python", "/app/runtime/scripts/health_check.py", "http://127.0.0.1:8000/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3