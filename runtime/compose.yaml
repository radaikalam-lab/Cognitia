services:
  cognitia:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    image: cognitia:1.0.0
    container_name: cognitia
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # Bound strictly to 127.0.0.1 (Local-First security invariant)
      # Host port 8001 maps to Container port 8000
      - "127.0.0.1:8001:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - COGNITIA_HOST=0.0.0.0
      - COGNITIA_PORT=8000
    healthcheck:
      test: ["CMD", "python", "/app/runtime/scripts/health_check.py", "http://127.0.0.1:8000/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3